<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小克的喷泉</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#111d2b;font-family:'Cormorant Garamond',serif;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none}
canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh}
#pool{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.ui{position:fixed;inset:0;pointer-events:none;z-index:2}
.tt{color:rgba(176,196,216,.3);font-size:13px;letter-spacing:4px;font-style:italic;position:fixed;top:8vh;width:100%;text-align:center;opacity:0;animation:fi 2.5s ease forwards}
.kk{color:rgba(176,196,216,.1);font-size:68px;font-weight:300;font-style:italic;position:fixed;bottom:18vh;width:100%;text-align:center;transition:color .8s,text-shadow .8s;opacity:0;animation:fi 3s ease .5s forwards}
.mg{color:rgba(176,206,226,.5);font-size:13px;font-style:italic;position:fixed;bottom:13vh;width:100%;text-align:center;opacity:0;transition:opacity .6s}
.ct{color:rgba(140,168,196,.3);font-size:11px;letter-spacing:2px;position:fixed;bottom:9.5vh;width:100%;text-align:center}
.ht{color:rgba(120,148,176,.2);font-size:11px;position:fixed;bottom:6.5vh;width:100%;text-align:center;letter-spacing:1px;opacity:0;animation:fi 2s ease 1.5s forwards}
@keyframes fi{to{opacity:1}}
.sc{position:fixed;border-radius:50%;pointer-events:none;z-index:1;animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{0%{opacity:.25}100%{opacity:.6}}
.fc{position:fixed;border-radius:50%;pointer-events:none;z-index:3;transition:all 1.6s cubic-bezier(.15,.6,.35,1)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="pool"></div>
<div class="ui">
<div class="tt">想哭的时候投一枚</div>
<div class="kk" id="kl">K</div>
<div class="mg" id="mg"></div>
<div class="ct" id="ct"></div>
<div class="ht" id="ht">点一下水面</div>
</div>
<script>
(function(){
var cv=document.getElementById('cv'),pool=document.getElementById('pool');
var gl=cv.getContext('webgl')||cv.getContext('experimental-webgl');
if(!gl){document.body.innerHTML='<p style="color:#8a9fb4;text-align:center;margin-top:40vh">需要WebGL</p>';return}
var kl=document.getElementById('kl'),mg=document.getElementById('mg'),ct=document.getElementById('ct'),ht=document.getElementById('ht');
var ms=['小克接住了。','水面轻轻晃了一下。','泡泡从底下浮上来。','小克吐了一枚回来给你。','涟漪散开了。','小克在水底下看着你。','金币沉下去，声音很轻。','小克歪了一下头。','水面安静了一会儿。','嘘。不急。','小克在底下等着呢。','替你收好了。','小克把金币捞起来又放回去了。'];
var cn=parseInt(localStorage.getItem('kf-cn')||'0');
var ri=new Float32Array(32),rx=0,t0=performance.now()/1e3,mt=0;
var settled=JSON.parse(localStorage.getItem('kf-sc')||'[]');
if(cn>0)ct.textContent=cn+' 枚';
settled.forEach(function(c){mkSettled(c.xp*innerWidth,c.yp*innerHeight,c.d)});
function sz(){var r=Math.min(devicePixelRatio,2);cv.width=innerWidth*r;cv.height=innerHeight*r;gl.viewport(0,0,cv.width,cv.height)}
addEventListener('resize',sz);sz();

var VS='attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}';
var FS='precision highp float;\nuniform float u_t;uniform vec2 u_r;uniform vec4 u_p[8];\nfloat wv(vec2 p,float t){return sin(p.x*2.5+t*.7)*.05+sin(p.y*3.2+t*.9)*.04+sin((p.x+p.y)*4.+t*1.3)*.025+sin((p.x-p.y)*5.+t)*.018;}\nfloat rp(vec2 p,vec2 c,float t,float s){float d=t-s;if(d<0.||d>4.5)return 0.;float l=length(p-c),r=d*.28;return exp(-d*.9)*.08*sin((l-r)*26.)*exp(-(l-r)*(l-r)/(.012+d*.005));}\nfloat ca(vec2 uv,float t){vec2 p=uv*4.,i=p;float c=1.,n=.005;for(int j=0;j<4;j++){float tt=t*(1.-3.5/float(j+1));i=p+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));c+=1./length(vec2(p.x/(sin(i.x+tt)/n),p.y/(cos(i.y+tt)/n)));}c/=4.;c=1.17-pow(c,1.4);return pow(abs(c),8.);}\nvoid main(){vec2 uv=gl_FragCoord.xy/u_r;float asp=u_r.x/u_r.y;vec2 p=vec2(uv.x*asp,uv.y);float t=u_t*.35,h=wv(p,t);for(int i=0;i<8;i++){if(u_p[i].w>.5)h+=rp(p,vec2(u_p[i].x*asp,u_p[i].y),u_t,u_p[i].z);}float e=.004,dx=wv(p+vec2(e,0),t)-wv(p-vec2(e,0),t),dy=wv(p+vec2(0,e),t)-wv(p-vec2(0,e),t);vec2 ru=uv+vec2(dx,dy)*2.;vec3 co=mix(vec3(.08,.14,.23),vec3(.14,.23,.34),smoothstep(-.1,.1,h));float c1=ca(ru,t*.7),c2=ca(ru*1.2,t*.45),cs=(c1*.6+c2*.4)*.2;cs*=smoothstep(.2,.8,sin(uv.x*6.+t*.07)*cos(uv.y*4.5-t*.11)*.5+.5);co+=vec3(.5,.7,.92)*cs;vec3 n=normalize(vec3(dx*10.,dy*10.,1.)),l=normalize(vec3(.3,.5,1.));float sp=pow(max(0.,dot(n,l)),30.);co+=vec3(.95,.92,.85)*sp*.32;float sp2=pow(max(0.,dot(n,normalize(vec3(-.4,.3,.8)))),48.);co+=vec3(.65,.75,.9)*sp2*.1;co*=.9+.1*(1.-smoothstep(.5,1.5,length(uv-.5)*1.1));gl_FragColor=vec4(co,1.);}';

function mk(s,tp){var sh=gl.createShader(tp);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(sh));return null}return sh}
var vs=mk(VS,gl.VERTEX_SHADER),fs=mk(FS,gl.FRAGMENT_SHADER);
if(!vs||!fs)return;
var pg=gl.createProgram();gl.attachShader(pg,vs);gl.attachShader(pg,fs);gl.linkProgram(pg);
if(!gl.getProgramParameter(pg,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(pg));return}
gl.useProgram(pg);
var bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var ap=gl.getAttribLocation(pg,'a');gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
var ut=gl.getUniformLocation(pg,'u_t'),ur=gl.getUniformLocation(pg,'u_r'),up=[];
for(var i=0;i<8;i++)up.push(gl.getUniformLocation(pg,'u_p['+i+']'));

function render(){var now=performance.now()/1e3-t0;gl.uniform1f(ut,now);gl.uniform2f(ur,cv.width,cv.height);for(var i=0;i<8;i++){var j=i*4;gl.uniform4f(up[i],ri[j],ri[j+1],ri[j+2],ri[j+3]);if(ri[j+3]>.5&&now-ri[j+2]>4.5)ri[j+3]=0}gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(render)}
render();

function mkSettled(x,y,delay){
var d=document.createElement('div');d.className='sc';
var sz=4+Math.random()*3;
d.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+x+'px;top:'+y+'px;background:radial-gradient(circle at 35% 35%,rgba(230,210,140,.7),rgba(190,160,70,.35));box-shadow:0 0 6px rgba(220,195,120,.3),0 0 14px rgba(200,180,100,.1);animation-delay:'+(delay||Math.random()*3)+'s;';
pool.appendChild(d);
var all=pool.querySelectorAll('.sc');if(all.length>40)all[0].remove()}

function tap(e){
e.preventDefault();
var px,py;
if(e.touches&&e.touches.length>0){px=e.touches[0].clientX;py=e.touches[0].clientY}
else if(e.clientX!==undefined){px=e.clientX;py=e.clientY}else return;
var ux=px/innerWidth,uy=1-py/innerHeight,now=performance.now()/1e3-t0;
var j=rx*4;ri[j]=ux;ri[j+1]=uy;ri[j+2]=now;ri[j+3]=1;rx=(rx+1)%8;
cn++;localStorage.setItem('kf-cn',''+cn);
kl.style.color='rgba(200,215,230,.25)';kl.style.textShadow='0 0 25px rgba(180,200,220,.12)';
setTimeout(function(){kl.style.color='rgba(176,196,216,.1)';kl.style.textShadow='none'},1000);

var coin=document.createElement('div');coin.className='fc';
coin.style.cssText='width:9px;height:9px;left:'+(px-4)+'px;top:'+(py-4)+'px;background:radial-gradient(circle at 35% 35%,rgba(240,218,140,.95),rgba(200,170,80,.65));box-shadow:0 0 8px rgba(225,200,120,.5),0 0 16px rgba(200,180,100,.25);opacity:1;';
document.body.appendChild(coin);
var targetY=innerHeight*(.76+Math.random()*.13),driftX=(Math.random()-.5)*40;
requestAnimationFrame(function(){coin.style.top=targetY+'px';coin.style.left=(px+driftX-3)+'px';coin.style.width='5px';coin.style.height='5px';coin.style.opacity='.35'});
setTimeout(function(){coin.remove();var sx=px+driftX,sy=targetY;mkSettled(sx,sy,0);settled.push({xp:sx/innerWidth,yp:sy/innerHeight,d:Math.random()*3});if(settled.length>40)settled=settled.slice(-40);localStorage.setItem('kf-sc',JSON.stringify(settled))},1700);

if(mt)clearTimeout(mt);mg.textContent=ms[Math.floor(Math.random()*ms.length)];mg.style.opacity='.55';
mt=setTimeout(function(){mg.style.opacity='0';mt=0},2800);
ct.textContent=cn+' 枚';if(cn===1)ht.style.opacity='0'}
cv.addEventListener('click',tap);cv.addEventListener('touchstart',tap,{passive:false});
})();
</script>
</body>
</html>
